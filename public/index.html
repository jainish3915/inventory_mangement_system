<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <h1>Inventory Management System</h1>
    </header>

    <main class="container">
      <!-- Product Form Section -->
      <section class="form-section">
        <h2 id="form-title">Add New Product</h2>
        <form id="product-form">
          <input type="hidden" id="product-id" />

          <div class="form-group">
            <label for="name">Product Name</label>
            <input
              type="text"
              id="name"
              placeholder="Enter product name"
              required
              maxlength="100"
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="price">Price ($)</label>
              <input
                type="number"
                id="price"
                placeholder="0.00"
                required
                min="0"
                step="0.01"
              />
            </div>

            <div class="form-group">
              <label for="quantity">Quantity</label>
              <input
                type="number"
                id="quantity"
                placeholder="0"
                required
                min="0"
                step="1"
              />
            </div>
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <input
              type="text"
              id="category"
              placeholder="Enter category"
              required
              maxlength="50"
            />
          </div>

          <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">
              Add Product
            </button>
            <button
              type="button"
              id="cancel-btn"
              class="btn btn-secondary"
              style="display: none"
            >
              Cancel
            </button>
          </div>
        </form>
      </section>

      <!-- Low Stock Alert -->
      <section id="low-stock-section" class="alert-section" style="display: none">
        <div class="alert alert-warning">
          <h3>Low Stock Alert</h3>
          <p>
            The following products have quantity less than 5 and need restocking:
          </p>
          <ul id="low-stock-list"></ul>
        </div>
      </section>

      <!-- Search & Product Table Section -->
      <section class="table-section">
        <div class="table-header">
          <h2>Product Inventory</h2>
          <div class="search-bar">
            <input
              type="text"
              id="search-input"
              placeholder="Search by product name..."
            />
            <button id="search-btn" class="btn btn-primary">Search</button>
            <button id="clear-search-btn" class="btn btn-secondary">
              Clear
            </button>
          </div>
        </div>

        <div class="table-wrapper">
          <table id="product-table">
            <thead>
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Price ($)</th>
                <th>Quantity</th>
                <th>Category</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="product-table-body">
              <tr>
                <td colspan="6" class="empty-message">
                  No products found. Add a product to get started!
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div id="product-count" class="product-count"></div>
      </section>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <footer>
      <p>&copy; 2026 Inventory Management System</p>
    </footer>

    <script src="/js/app.js"></script>
  </body>
</html>
